<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Panel IoT del aula inteligente: telemetría Wokwi → MQTT → Node-RED." />
    <meta name="theme-color" content="#f5f8f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1514" media="(prefers-color-scheme: dark)" />
    <link
      rel="preload"
      href="/fonts/plus-jakarta-sans-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
      fetchpriority="high"
    />
    <script>
      // Apply saved/system theme before paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("dashlot-theme");
          if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    <title>Dashboard aula inteligente · EMS-IoT</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
