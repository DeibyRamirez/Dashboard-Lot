services:
  nodered:
    build:
      context: ./nodered
      dockerfile: Dockerfile
    container_name: lot-nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    environment:
      TZ: ${TZ:-America/Bogota}
      SEED_SIMULATOR: ${SEED_SIMULATOR:-false}
      DEVICE_ID: ${DEVICE_ID:-ESP32-AULA-101}
      MQTT_TOPIC_TELEMETRIA: ${MQTT_TOPIC_TELEMETRIA:-aula/grupoX/telemetria}
      MQTT_TOPIC_ESTADO: ${MQTT_TOPIC_ESTADO:-aula/grupoX/estado}
      MQTT_TOPIC_COMANDOS: ${MQTT_TOPIC_COMANDOS:-aula/grupoX/comandos}
    volumes:
      - nodered_data:/data
      - ./nodered/flows/flows.json:/data/flows/seed-flows.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:1880/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  web:
    build:
      context: ./web-redesign/web
      dockerfile: Dockerfile
      args:
        VITE_MQTT_WS_URL: ${VITE_MQTT_WS_URL:-ws://broker.hivemq.com:8000/mqtt}
        VITE_MQTT_TOPIC_TELEMETRIA: ${VITE_MQTT_TOPIC_TELEMETRIA:-aula/grupoX/telemetria}
        VITE_MQTT_TOPIC_ESTADO: ${VITE_MQTT_TOPIC_ESTADO:-aula/grupoX/estado}
        VITE_MQTT_TOPIC_COMANDOS: ${VITE_MQTT_TOPIC_COMANDOS:-aula/grupoX/comandos}
        VITE_DEVICE_ID: ${VITE_DEVICE_ID:-ESP32-AULA-101}
        VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
        VITE_DATA_SOURCE: ${VITE_DATA_SOURCE:-nodered-api}
        VITE_API_BASE: ${VITE_API_BASE:-/api}
        VITE_POLL_INTERVAL_MS: ${VITE_POLL_INTERVAL_MS:-5000}
    container_name: lot-dashboard-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      nodered:
        condition: service_healthy

volumes:
  nodered_data:
